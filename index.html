<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ResumeForge — Professional Resume Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f14;
  --surface: #16181f;
  --surface2: #1e2029;
  --surface3: #252831;
  --border: #2e3140;
  --accent: #6c63ff;
  --text: #e8eaf0;
  --text2: #9499b0;
  --text3: #5c6180;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --r: 10px;
  --r2: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg: #f0f1f7;
  --surface: #ffffff;
  --surface2: #f5f6fc;
  --surface3: #eaebf4;
  --border: #d8dae8;
  --text: #1a1c2e;
  --text2: #555870;
  --text3: #8890aa;
  --shadow: 0 4px 24px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow:hidden;}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:5px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* LAYOUT */
#app{display:grid;grid-template-columns:240px 1fr 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
#topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);z-index:100}

#sidebar{
  grid-column:1;
  grid-row:2;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  display:block;
  height:calc(100vh - 56px);
  padding-bottom: 24px;
}
#editor{
  grid-column:2;
  grid-row:2;
  overflow-y:auto;
  padding:24px;
  background:var(--bg);
  height:calc(100vh - 56px);
}
#preview-panel{
  grid-column:3;
  grid-row:2;
  overflow-y:auto;
  background:var(--surface2);
  padding:20px;
  display:block;
  text-align:center;
  height:calc(100vh - 56px);
}

/* TOPBAR */
.logo{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.tb-spacer{flex:1}
.tb-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:var(--r2);cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--surface3);border-color:var(--accent)}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-btn.primary:hover{background:#7c75ff}
.tb-btn.danger{background:transparent;border-color:#ff4444;color:#ff4444}
.tb-btn.danger:hover{background:#ff4444;color:#fff}

/* SIDEBAR */
.sidebar-section{padding:16px 12px 8px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .12s;border-left:3px solid transparent;user-select:none}
.sidebar-item:hover{color:var(--text);background:var(--surface2)}
.sidebar-item.active{color:var(--accent);background:var(--surface2);border-left-color:var(--accent)}
.sidebar-item .si-icon{font-size:16px;width:20px;text-align:center}

.sidebar-bottom{
  padding:16px;
  border-top:1px solid var(--border);
  margin-top:16px; 
}
.template-pills{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tpl-pill{padding:8px 12px;border-radius:var(--r2);cursor:pointer;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;font-family:var(--font-body);text-align:left}
.tpl-pill:hover{border-color:var(--accent);color:var(--accent)}
.tpl-pill.active{border-color:var(--accent);background:var(--accent);color:#fff}
.font-select-ui{width:100%; background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:var(--r2);font-family:var(--font-body);font-size:12px;outline:none;cursor:pointer;}

/* EDITOR CARDS */
.ed-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ed-title{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--text)}
.ed-subtitle{color:var(--text3);font-size:12px;margin-top:2px}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;transition:border-color .15s}
.section-card:hover{border-color:var(--border)}
.card-title{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.3px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.card-title .actions{display:flex;gap:6px}
label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--r2);font-family:var(--font-body);font-size:13px;transition:border-color .15s;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.entry-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:12px;position:relative}
.entry-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.entry-title{font-weight:600;font-size:13px;color:var(--text)}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:var(--r2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;flex-shrink:0}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon.del:hover{border-color:#ff4444;color:#ff4444}
.btn-add{width:100%;padding:9px;background:transparent;border:1.5px dashed var(--border);color:var(--text3);border-radius:var(--r2);cursor:pointer;font-family:var(--font-body);font-size:13px;transition:all .15s;margin-top:4px}
.btn-add:hover{border-color:var(--accent);color:var(--accent)}
.tag-container{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);min-height:40px;cursor:text}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface3);border:1px solid var(--border);padding:3px 8px;border-radius:20px;font-size:12px;color:var(--text2)}
.tag .tag-del{cursor:pointer;color:var(--text3);font-size:11px;line-height:1;padding:0 2px;border-radius:2px}
.tag .tag-del:hover{color:#ff4444}
.tag-input{background:transparent;border:none;outline:none;font-family:var(--font-body);font-size:13px;color:var(--text);min-width:80px;flex:1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:13px;color:var(--text2)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px)}

/* PREVIEW */
#preview-scale-wrap{transform-origin:top center;width:210mm;margin:0 auto;text-align:left;}
#preview-wrap{width:210mm;min-height:297mm;background:#fff;color:#1a1c2e;box-shadow:var(--shadow);border-radius:4px;overflow:hidden;transform-origin:top center;flex-shrink:0}
.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;width:100%;max-width:210mm;margin-left:auto;margin-right:auto;}
.scale-info{font-size:11px;color:var(--text3);font-family:var(--font-mono)}

/* FIX: AVOID PAGE BREAKS */
.break-avoid { break-inside: avoid; page-break-inside: avoid; }

/* ============ TEMPLATE 1: PROFESSIONAL ============ */
.tpl-professional{font-family:var(--resume-font, 'Times New Roman', Times, serif);font-size:12px;line-height:1.5;color:#111;padding:0;background:#fff}
.tpl-professional .p-header{background:#fff;color:#111;padding:12px 20px 16px;border-bottom:2px solid #222}
.tpl-professional .p-name{font-size:32px;font-weight:bold;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.tpl-professional .p-role{font-size:14px;color:#444;font-style:italic;margin-bottom:12px}
.tpl-professional .p-contacts{display:flex;flex-wrap:wrap;gap:14px}
.tpl-professional .p-contact{display:flex;align-items:center;gap:5px;font-size:12px;color:#444}
.tpl-professional .p-body{display:grid;grid-template-columns:2fr 1fr;gap:0}
.tpl-professional .p-main{padding:16px 20px}
.tpl-professional .p-sidebar{padding:16px 20px;background:#fdfdfd;border-left:1px solid #ddd}
.tpl-professional .p-section{margin-bottom:20px}
.tpl-professional .p-section-title{font-size:14px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#222;border-bottom:1px solid #ccc;padding-bottom:5px;margin-bottom:12px}
.tpl-professional .p-entry{margin-bottom:14px}
.tpl-professional .p-entry-title{font-weight:bold;font-size:13px;color:#111}
.tpl-professional .p-entry-sub{font-size:12px;color:#444;font-style:italic;margin-bottom:2px}
.tpl-professional .p-entry-date{font-size:11px;color:#666;margin-bottom:4px}
.tpl-professional .p-entry-desc{font-size:12px;color:#222;line-height:1.6}
.tpl-professional .p-skill-cat{margin-bottom:10px}
.tpl-professional .p-skill-cat-name{font-size:12px;font-weight:bold;color:#111;margin-bottom:5px}
.tpl-professional .p-skill-tag{display:inline-block;color:#333;font-size:11px;margin:0 4px 0 0}
.tpl-professional .p-skill-tag:after{content:',';}
.tpl-professional .p-skill-tag:last-child:after{content:'';}
.tpl-professional .p-bullet{font-size:12px;color:#222;padding-left:12px;margin-bottom:3px;position:relative}
.tpl-professional .p-bullet:before{content:'•';position:absolute;left:0;}
.tpl-professional .p-lang{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #eee;font-size:12px}
.tpl-professional .p-lang:last-child{border-bottom:none}
.tpl-professional .p-lang-level{color:#555;font-size:11px;font-style:italic}
.tpl-professional .p-cert-item{padding:5px 0;border-bottom:1px solid #eee;font-size:12px}
.tpl-professional .p-cert-item:last-child{border-bottom:none}
.tpl-professional .p-cert-name{font-weight:bold;color:#111;font-size:12px}
.tpl-professional .p-cert-issuer{color:#555;font-size:11px}
.tpl-professional .p-edu-entry{margin-bottom:10px}
.tpl-professional .p-summary{font-size:12px;color:#222;line-height:1.6;text-align:justify}

/* ============ TEMPLATE 2: MODERN (ACCENT COLOR ENABLED) ============ */
.tpl-modern{font-family:var(--resume-font, 'DM Sans', sans-serif);font-size:11px;color:#1e1e2e}
.tpl-modern .m-header{padding:16px 20px;display:flex;align-items:flex-start;gap:24px;border-bottom:3px solid var(--accent)}
.tpl-modern .m-avatar{width:70px;height:70px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff;flex-shrink:0}
.tpl-modern .m-name{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#1e1e2e}
.tpl-modern .m-role{font-size:12px;color:var(--accent);font-weight:600;margin:3px 0 10px}
.tpl-modern .m-contacts{display:flex;flex-wrap:wrap;gap:10px}
.tpl-modern .m-contact{font-size:10px;color:#666;display:flex;align-items:center;gap:4px;background:#f5f6fa;padding:3px 8px;border-radius:20px}
.tpl-modern .m-body{padding:16px 20px}
.tpl-modern .m-section{margin-bottom:20px}
.tpl-modern .m-section-title{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.tpl-modern .m-section-title:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0.4}
.tpl-modern .m-entry{margin-bottom:14px;padding-left:12px;border-left:2px solid var(--accent)}
.tpl-modern .m-entry-title{font-weight:700;font-size:12px;color:#1e1e2e}
.tpl-modern .m-entry-sub{color:var(--accent);font-size:11px;font-weight:500}
.tpl-modern .m-entry-date{font-size:10px;color:#999;margin-bottom:4px;font-family:'DM Mono',monospace}
.tpl-modern .m-entry-desc{font-size:11px;color:#555;line-height:1.65}
.tpl-modern .m-skill-grid{display:flex;flex-wrap:wrap;gap:5px}
.tpl-modern .m-skill-tag{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;background:#f5f6fa;color:var(--accent);border:1px solid var(--accent)}
.tpl-modern .m-bullet{font-size:11px;color:#444;padding-left:14px;position:relative;margin-bottom:3px}
.tpl-modern .m-bullet:before{content:'●';position:absolute;left:0;color:var(--accent);font-size:7px;top:3px}
.tpl-modern .m-two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tpl-modern .m-cert{background:#fff;border:1px solid var(--accent);border-radius:5px;padding:8px 10px;margin-bottom:6px}
.tpl-modern .m-cert-name{font-weight:600;font-size:11px;color:#1e1e2e}
.tpl-modern .m-cert-org{font-size:10px;color:var(--accent)}

/* ============ TEMPLATE 3: CREATIVE (ACCENT COLOR ENABLED) ============ */
.tpl-creative{font-family:var(--resume-font, 'DM Sans', sans-serif);font-size:11px;display:grid;grid-template-columns:160px 1fr;min-height:297mm}
.tpl-creative .c-sidebar{background:var(--accent);color:#fff;padding:0}
.tpl-creative .c-avatar-area{padding:28px 20px 20px;text-align:center;background:rgba(0,0,0,0.15)}
.tpl-creative .c-avatar{width:64px;height:64px;background:rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;margin:0 auto 12px;border:3px solid rgba(255,255,255,0.5)}
.tpl-creative .c-name-small{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:-0.3px;line-height:1.2}
.tpl-creative .c-role-small{font-size:10px;opacity:0.8;margin-top:4px}
.tpl-creative .c-sidebar-section{padding:16px 16px 8px}
.tpl-creative .c-sidebar-title{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:0.7;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.25)}
.tpl-creative .c-contact-item{font-size:10px;opacity:0.9;margin-bottom:5px;word-break:break-all;line-height:1.4}
.tpl-creative .c-main{background:#fff;color:#1e1e2e;padding:16px 20px}
.tpl-creative .c-main-name{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#1e1e2e}
.tpl-creative .c-main-role{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:16px}
.tpl-creative .c-section{margin-bottom:18px}
.tpl-creative .c-section-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tpl-creative .c-section-title:after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0.5}
.tpl-creative .c-entry{margin-bottom:12px}
.tpl-creative .c-entry-title{font-weight:700;font-size:12px;color:#1e1e2e}
.tpl-creative .c-entry-sub{font-size:11px;color:var(--accent);font-weight:500}
.tpl-creative .c-entry-date{font-size:10px;color:#999;margin-bottom:4px;font-family:'DM Mono',monospace}
.tpl-creative .c-entry-desc{font-size:11px;color:#555;line-height:1.6}
.tpl-creative .c-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500;background:#f5f6fa;color:var(--accent);border:1px solid var(--accent);margin:2px 2px 2px 0}
.tpl-creative .c-bullet{font-size:11px;color:#444;padding-left:12px;position:relative;margin-bottom:3px}
.tpl-creative .c-bullet:before{content:'◆';position:absolute;left:0;color:var(--accent);font-size:6px;top:3px}

/* ============ TEMPLATE 4: CONVENTIONAL ============ */
.tpl-conventional{font-family:var(--resume-font, 'Times New Roman', Times, serif);font-size:12px;color:#000;background:#fff;max-width:210mm;margin:0 auto}
.tpl-conventional .cv-header{text-align:center;margin-bottom:20px}
.tpl-conventional .cv-name{font-size:26px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tpl-conventional .cv-contacts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;font-size:12px}
.tpl-conventional .cv-section{margin-bottom:16px}
.tpl-conventional .cv-section-title{font-size:14px;font-weight:bold;text-transform:uppercase;border-bottom:1px solid #000;margin-bottom:10px;padding-bottom:2px}
.tpl-conventional .cv-entry{margin-bottom:12px}
.tpl-conventional .cv-entry-header{display:flex;justify-content:space-between;align-items:baseline;font-weight:bold;font-size:13px}
.tpl-conventional .cv-entry-sub{display:flex;justify-content:space-between;font-style:italic;margin-bottom:6px;font-size:12px}
.tpl-conventional .cv-skills{display:flex; gap:10px; margin-bottom:6px}
.tpl-conventional .cv-skill-cat{font-weight:bold; min-width:120px;}
.tpl-conventional .cv-bullet{margin-bottom:4px;padding-left:16px;position:relative;line-height:1.5}
.tpl-conventional .cv-bullet:before{content:'•';position:absolute;left:0}
.tpl-conventional .cv-desc{line-height:1.5;text-align:justify}

/* UTILITY */
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surface3);color:var(--text2)}
.divider{height:1px;background:var(--border);margin:16px 0}
.hint{font-size:11px;color:var(--text3);font-style:italic;margin-top:4px}
.section-vis-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.section-vis-row:last-child{border-bottom:none}
.section-vis-name{color:var(--text)}
select option{background:var(--surface2);color:var(--text)}

/* ALERTS */
.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

/* HISTORY BADGE */
.history-badge{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:6px 10px;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.history-item:last-child{border-bottom:none}

/* Color pickers */
.color-option{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-option.active{border-color:var(--text);transform:scale(1.15)}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* =========================================
   NATIVE PRINT CSS - STRICT 1CM MARGIN FIX
========================================= */
@media print {
  @page { 
    size: A4 portrait; 
    margin: 1cm 1.5cm !important; /* EXACTLY 1CM TOP/BOTTOM, 1.5CM SIDES FOR ALL PAGES */
  }
  
  html, body { 
    height: auto !important; 
    min-height: auto !important;
    overflow: visible !important; 
    background: #fff !important; 
    -webkit-print-color-adjust: exact; 
    print-color-adjust: exact; 
    margin: 0 !important;
    padding: 0 !important;
  }
  
  /* Hide the UI tools entirely */
  #app > *:not(#preview-panel) { 
    display: none !important; 
  }
  
  /* Reset layout constraints so print engine sees whole document */
  #app { 
    display: block !important; 
    height: auto !important; 
    overflow: visible !important; 
  }
  
  #preview-panel { 
    display: block !important; 
    padding: 0 !important; 
    margin: 0 !important; 
    background: transparent !important; 
    overflow: visible !important; 
    height: auto !important; 
  }
  
  /* Strip ALL UI scaling boundaries */
  #preview-scale-wrap { 
    transform: none !important; 
    width: auto !important; 
    margin: 0 !important; 
    padding: 0 !important;
  }
  
  #preview-wrap { 
    box-shadow: none !important; 
    border-radius: 0 !important; 
    width: auto !important; 
    max-width: none !important;
    margin: 0 !important; 
    padding: 0 !important; /* Margins are handled purely by @page now */
    min-height: auto !important;
    height: auto !important;
    overflow: visible !important;
  }
  
  /* Apply page breaks properly */
  .break-avoid { break-inside: avoid !important; page-break-inside: avoid !important; }
}

/* Responsive */
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:56px auto auto}
  #sidebar{display:none}
  #preview-panel{display:none}

}

      versionHistory.slice().reverse().map((v,i)=>`

          <div style="font-size:11px;color:var(--text3)">${v.ts}</div></div>
          <div class="flex gap-2">
            <button class="tb-btn" style="font-size:11px;padding:4px 10px" onclick="restoreVersion(${versionHistory.length-1-i})">Restore</button>

function saveVersion(){
  const label=prompt('Version label (optional):','v'+(versionHistory.length+1)+' - '+new Date().toLocaleDateString())||('v'+(versionHistory.length+1));
  versionHistory.push({label,ts:new Date().toLocaleString(),data:deepClone(state)});
  if(versionHistory.length>20)versionHistory.shift();
  localStorage.setItem('resumeforge_history',JSON.stringify(versionHistory));
  showToast('Version saved: '+label);
  if(currentSection==='history')renderEditor();
}
function restoreVersion(i){
  if(confirm('Restore this version? Current changes will be overwritten.')){
    state=deepClone(versionHistory[i].data);save();renderEditor();renderPreview();
    showToast('Version restored!');
  }
}
function deleteVersion(i){
  versionHistory.splice(i,1);
  localStorage.setItem('resumeforge_history',JSON.stringify(versionHistory));
  renderEditor();showToast('Version deleted');
}

function renderPreview(){
  const wrap=document.getElementById('resume-preview');
  const sv=state.sectionVisibility||{};
  if(currentTemplate==='conventional') wrap.innerHTML=renderConventional(sv);
  else if(currentTemplate==='professional') wrap.innerHTML=renderProfessional(sv);
  else if(currentTemplate==='modern') wrap.innerHTML=renderModern(sv);
  else wrap.innerHTML=renderCreative(sv);
  scalePreview();
}

function scalePreview(){
  const panel=document.getElementById('preview-panel');
  const wrap=document.getElementById('preview-scale-wrap');
  const mmToPx=3.7795;
  const targetW=210*mmToPx;
  const availW=panel.clientWidth-40;
  const scale=Math.min(1,availW/targetW);
  wrap.style.transform=`scale(${scale})`;
  wrap.style.width=targetW+'px';
  
  const wrapH=document.getElementById('preview-wrap').offsetHeight*scale;
  wrap.parentElement.style.height=(wrapH+40)+'px';
  document.getElementById('scale-info').textContent=`Scale ${Math.round(scale*100)}%`;
}

function initials(name){return name.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)}
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// =============================================
// NATIVE PDF EXPORT (REPLACES HTML2PDF)
// =============================================
function exportPDF(){
  const scaleWrap = document.getElementById('preview-scale-wrap');
  const origTransform = scaleWrap.style.transform;
  const origWidth = scaleWrap.style.width;
  
  scaleWrap.style.transform = 'none';
  scaleWrap.style.width = '100%';

  showToast('REMINDER: Change Destination to "Save as PDF" and Uncheck "Headers and Footers"!', 6000);
  
  setTimeout(() => {
    window.print();
    
    scaleWrap.style.transform = origTransform;
    scaleWrap.style.width = origWidth;
  }, 150);
}

// =============================================
// TEMPLATE SELECT BINDING
// =============================================
document.getElementById('template-select').addEventListener('change',function(){
  switchTemplate(this.value);
});

// =============================================
// INIT
// =============================================
function init(){
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('dark-btn').textContent=isDark?'🌙':'☀️';
  document.documentElement.style.setProperty('--accent',accentColor);
  if(currentFont) document.documentElement.style.setProperty('--resume-font', currentFont);
  
  buildSidebar();
  renderEditor();
  renderPreview();
  window.addEventListener('resize',scalePreview);
}

init();
</script>
